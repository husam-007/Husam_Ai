<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة الذكاء الاصطناعي والامن السيبراني</title>
    <!-- خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #05070d;
            --card-bg: rgba(15, 20, 36, 0.9);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.45);
            --secondary: #ec4899;
            --accent: #06b6d4;
            --cyber-glow: #10b981;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 8%, rgba(99, 102, 241, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(236, 72, 153, 0.16) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 60%);
            background-attachment: fixed;
        }

        /* ترويسة الموقع مع البروفايل الشخصي */
        header {
            text-align: center;
            padding: 35px 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-container {
            position: relative;
            margin-bottom: 18px;
            display: inline-block;
        }

        .profile-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #6366f1, #ec4899, #06b6d4);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.5), 0 0 45px rgba(6, 182, 212, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: top center;
            background-color: #0b0f19;
            border: 2px solid var(--bg-dark);
        }

        .profile-container:hover .profile-avatar {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.6), 0 0 55px rgba(99, 102, 241, 0.4);
        }

        .profile-badge {
            position: absolute;
            bottom: 2px;
            left: 5px;
            background: #0284c7;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            border: 2px solid var(--bg-dark);
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.8);
        }

        .founder-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }

        .founder-tag span {
            color: #38bdf8;
        }

        header h1 {
            font-size: 2.7rem;
            font-weight: 900;
            background: linear-gradient(135deg, #a5b4fc, #f472b6, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 850px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* الشريط الإخباري المتحرك */
        .ticker-wrapper {
            width: 95%;
            max-width: 1400px;
            margin: 15px auto 5px;
            background: rgba(18, 24, 43, 0.75);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 40px;
            display: flex;
            align-items: center;
            padding: 5px 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
            position: relative;
        }

        .ticker-badge {
            background: linear-gradient(135deg, #ef4444, #ec4899);
            color: #fff;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            z-index: 5;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.5);
        }

        .ticker-badge i {
            animation: pulse 1.5s infinite;
        }

        .ticker-track {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            margin-right: 15px;
        }

        .ticker-content {
            display: inline-flex;
            gap: 40px;
            animation: marquee 45s linear infinite;
        }

        .ticker-wrapper:hover .ticker-content {
            animation-play-state: paused;
        }

        .ticker-item {
            color: var(--text-light);
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .ticker-item:hover {
            color: var(--accent);
        }

        .ticker-item span.tag {
            background: rgba(255, 255, 255, 0.08);
            color: #818cf8;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(50%); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* لوحة التحكم والبحث */
        .controls-panel {
            max-width: 1100px;
            margin: 15px auto 10px;
            padding: 0 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 280px;
            max-width: 550px;
        }

        .search-box input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 12px 45px 12px 20px;
            border-radius: 30px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 16px var(--primary-glow);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-box i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .view-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .view-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 18px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .view-btn.active {
            background: var(--primary);
            color: #fff;
        }

        /* تصنيفات المجالات */
        .categories-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .cat-btn:hover, .cat-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 12px var(--primary-glow);
            border-color: transparent;
            transform: translateY(-2px);
        }

        .cat-count {
            background: rgba(0, 0, 0, 0.35);
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        /* مساحة العرض والسلايدر */
        .slider-wrapper {
            position: relative;
            max-width: 1400px;
            margin: 10px auto 35px;
            width: 95%;
            display: flex;
            align-items: center;
        }

        .cards-container {
            width: 100%;
            display: flex;
            gap: 22px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 20px 10px;
            scrollbar-width: none;
        }

        .cards-container::-webkit-scrollbar {
            display: none;
        }

        .cards-container.grid-mode {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 22px;
            overflow: visible;
        }

        /* الفلاش كارد والتأثير ثلاثي الأبعاد */
        .card-perspective {
            perspective: 1100px;
            flex: 0 0 315px;
            height: 440px;
        }

        .cards-container.grid-mode .card-perspective {
            flex: none;
            width: 100%;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 18px;
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            background: var(--card-bg);
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s;
        }

        .card:hover .card-face {
            border-color: rgba(99, 102, 241, 0.5);
        }

        /* الوجه الأمامي */
        .card-front {
            align-items: center;
            text-align: center;
        }

        .badge {
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.78rem;
            align-self: flex-start;
            font-weight: 600;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(99,102,241,0.12));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #818cf8;
            margin-top: 8px;
            border: 1px solid var(--border);
        }

        .tool-title {
            font-size: 1.35rem;
            margin-top: 12px;
            font-weight: 800;
        }

        .tool-short {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 8px 0;
        }

        .hint-text {
            font-size: 0.8rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
        }

        /* الوجه الخلفي */
        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, rgba(18, 24, 42, 0.98), rgba(9, 13, 24, 0.98));
            border-color: rgba(99, 102, 241, 0.5);
        }

        .card-back h3 {
            font-size: 1.2rem;
            color: #a5b4fc;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .full-desc {
            font-size: 0.85rem;
            color: #e2e8f0;
            line-height: 1.55;
            margin-bottom: 10px;
        }

        .features-list {
            list-style: none;
            margin-bottom: 12px;
        }

        .features-list li {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .features-list li i {
            color: #10b981;
            font-size: 0.8rem;
        }

        .tool-link {
            display: block;
            text-align: center;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .tool-link:hover {
            box-shadow: 0 0 15px var(--primary-glow);
            transform: scale(1.02);
        }

        /* أسهم السلايدر */
        .slide-arrow {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: absolute;
            z-index: 10;
        }

        .slide-arrow:hover {
            background: var(--primary);
            box-shadow: 0 0 14px var(--primary-glow);
        }

        .arrow-prev { right: -20px; }
        .arrow-next { left: -20px; }

        .hidden { display: none !important; }

        footer {
            text-align: center;
            padding: 22px;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 700;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        footer span {
            color: #818cf8;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 1.85rem; }
            .profile-avatar { width: 110px; height: 110px; }
            .card-perspective { flex: 0 0 280px; }
            .slide-arrow { display: none; }
            .ticker-wrapper { border-radius: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <!-- إطار الصورة الشخصية المحدث بالرابط الجديد مع معالج تلقائي لروابط ImgBB -->
        <div class="profile-container">
            <div class="profile-avatar">
                <img id="userAvatar"
                     src="./images/hossam.jpg"
                     alt="حسام صلاح عطيه"
                     width="130"
                     height="130"
                     loading="eager"
                     fetchpriority="high"
                     onerror="handleImageFallback(this)">
            </div>
            <div class="profile-badge" title="خبير ومطور معتمد">
                <i class="fa-solid fa-check"></i>
            </div>
        </div>

        <div class="founder-tag">
            <i class="fa-solid fa-shield-halved"></i> إعداد وتطوير: <span>حسام صلاح عطيه</span>
        </div>

        <h1>موسوعة الذكاء الاصطناعي والامن السيبراني ⚡</h1>
        <p>المرجع الشامل لأهم وأحدث أدوات الذكاء الاصطناعي والدفاع السيبراني المتاحة حالياً، مع تصنيف دقيق وفلاش كاردز تفاعلية ثلاثية الأبعاد.</p>
    </header>

    <!-- شريط التحديثات اليومية المتحرك -->
    <div class="ticker-wrapper">
        <div class="ticker-badge">
            <i class="fa-solid fa-circle-dot"></i> تحديثات اليوم
        </div>
        <div class="ticker-track">
            <div class="ticker-content" id="tickerItems"></div>
        </div>
    </div>

    <!-- شريط البحث وطريقة العرض -->
    <div class="controls-panel">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ابحث بين 225 أداة (بالاسم أو الوظيفة أو المجال)..." oninput="handleSearch()">
        </div>
        <div class="view-toggle">
            <button class="view-btn active" id="btnSlider" onclick="setViewMode('slider')">
                <i class="fa-solid fa-arrows-left-right"></i> سلايدر
            </button>
            <button class="view-btn" id="btnGrid" onclick="setViewMode('grid')">
                <i class="fa-solid fa-grip"></i> شبكة (عرض شامل)
            </button>
        </div>
    </div>

    <!-- أزرار التصنيفات -->
    <nav class="categories-nav" id="categoriesNav"></nav>

    <!-- مساحة الكروت السلايدر -->
    <div class="slider-wrapper">
        <button class="slide-arrow arrow-prev" id="arrowPrev" onclick="scrollSlider('right')"><i class="fa-solid fa-chevron-right"></i></button>
        
        <div class="cards-container" id="cardsTrack"></div>

        <button class="slide-arrow arrow-next" id="arrowNext" onclick="scrollSlider('left')"><i class="fa-solid fa-chevron-left"></i></button>
    </div>

    <!-- التذييل المطلوب -->
    <footer>
        جميع الحقوق محفوظه : <span>حسام صلاح عطيه 2026</span>
    </footer>

    <script>
        // صورة بديلة عند تعذر تحميل الصورة المحلية
        function handleImageFallback(imgElement) {
            imgElement.onerror = null;
            imgElement.src = "https://ui-avatars.com/api/?name=Hossam+Attia&background=6366f1&color=fff&size=150";
        }

        // بيانات الشريط الإخباري المتحرك
        const dailyNews = [
            { tool: "Darktrace", domain: "الأمن السيبراني", note: "إطلاق محرك التعلم الذاتي للتصدي لاختراقات الفدية في ثوانٍ معدودة." },
            { tool: "Cursor AI", domain: "البرمجة", note: "تحديثات ثورية في فهم كامل مستودع الـ Codebase ومساعدة هندسية فورية." },
            { tool: "FLUX.1", domain: "تصميم الصور", note: "يتصدر تقييمات رسم التايبوجرافي بدقة خيالية تفوقت على المنافسين." },
            { tool: "CrowdStrike Charlotte", domain: "الأمن السيبراني", note: "تسريع تحقيقات مراكز العمليات الأمنية SOC بنسبة 70%." },
            { tool: "Runway Gen-3", domain: "الفيديو", note: "ميزة التحكم السينمائي المتقدم بحركة الكاميرا والإضاءة." },
            { tool: "Claude 3.5 Sonnet", domain: "الكتابة والتحليل", note: "النموذج الأكثر براعة في فهم المستندات الضخمة وصياغة المحتوى البشري." },
            { tool: "Perplexity AI", domain: "البحث الأكاديمي", note: "تطوير ميزة توثيق المصادر اللحظية في الأوراق العلمية والتقارير." },
            { tool: "Suno AI V3", domain: "الصوت والموسيقى", note: "إنتاج مقطوعات غنائية متكاملة بلهجات عربية بجودة استوديو." },
            { tool: "Wiz AI-SPM", domain: "الأمن السحابي", note: "كشف مسارات الهجمات السحابية الحساسة بدون الحاجة لتثبيت Agent." }
        ];

        // تعبئة الشريط الإخباري
        const tickerContainer = document.getElementById('tickerItems');
        const repeatedNews = [...dailyNews, ...dailyNews];
        tickerContainer.innerHTML = repeatedNews.map(item => `
            <div class="ticker-item" onclick="searchFromTicker('${item.tool}')">
                <span class="tag">${item.domain}</span>
                <strong>${item.tool}:</strong> ${item.note}
            </div>
        `).join('');

        function searchFromTicker(toolName) {
            document.getElementById('searchInput').value = toolName;
            handleSearch();
            window.scrollTo({ top: 430, behavior: 'smooth' });
        }

        // التصنيفات
        const categories = [
            { id: "all", label: "الكل", icon: "fa-layer-group" },
            { id: "cyber", label: "الأمن السيبراني", icon: "fa-shield-halved" },
            { id: "img", label: "الصور والتصميم", icon: "fa-image" },
            { id: "video", label: "الفيديو والمونتاج", icon: "fa-video" },
            { id: "code", label: "البرمجة والتطوير", icon: "fa-code" },
            { id: "write", label: "الكتابة والمحتوى", icon: "fa-pen-nib" },
            { id: "market", label: "التسويق والأعمال", icon: "fa-chart-line" },
            { id: "edu", label: "التعليم والبحث", icon: "fa-graduation-cap" },
            { id: "audio", label: "الصوت والموسيقى", icon: "fa-headphones-simple" },
            { id: "prod", label: "الإنتاجية والأتمتة", icon: "fa-bolt" },
            { id: "3d", label: "3D والعوالم الافتراضية", icon: "fa-cube" }
        ];

        // مصفوفة الـ 225 أداة
        const rawTools = [

        // معالجة البيانات
        const aiTools = rawTools.map((t, index) => ({
            id: index + 1,
            name: t[0],
            category: t[1],
            catLabel: t[2],
            icon: t[3],
            shortDesc: t[4],
            fullDesc: t[5],
            features: t[6],
            link: t[7]
        }));

        let currentCategory = "all";
        const container = document.getElementById('cardsTrack');
        const navContainer = document.getElementById('categoriesNav');

        // بناء شريط التصنيفات
        function buildCategoriesNav() {
            navContainer.innerHTML = '';
            categories.forEach(cat => {
                const count = cat.id === 'all' 
                    ? aiTools.length 
                    : aiTools.filter(t => t.category === cat.id).length;

                const btn = document.createElement('button');
                btn.className = `cat-btn ${cat.id === currentCategory ? 'active' : ''}`;
                btn.innerHTML = `
                    <i class="fa-solid ${cat.icon}"></i> 
                    ${cat.label} 
                    <span class="cat-count">${count}</span>
                `;
                btn.onclick = () => selectCategory(cat.id, btn);
                navContainer.appendChild(btn);
            });
        }

        // بناء البطاقات
        function renderCards(tools) {
            container.innerHTML = '';
            
            if (tools.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; width: 100%; padding: 60px 20px; color: var(--text-muted);">
                        <i class="fa-solid fa-face-meh" style="font-size: 3.5rem; margin-bottom: 15px; display: block; color: var(--primary);"></i>
                        <h3>لم يتم العثور على أداة مطابقة لبحثك</h3>
                        <p style="margin-top: 5px; font-size: 0.9rem;">جرب كتابة كلمات بحثية أخرى أو استعرض الأقسام المختلفة</p>
                    </div>
                `;
                return;
            }

            const fragment = document.createDocumentFragment();

            tools.forEach(tool => {
                const cardPerspective = document.createElement('div');
                cardPerspective.className = 'card-perspective';

                cardPerspective.innerHTML = `
                    <div class="card" onclick="toggleFlip(this)">
                        <!-- الوجه الأمامي -->
                        <div class="card-face card-front">
                            <span class="badge">${tool.catLabel} #${tool.id}</span>
                            <div class="tool-icon">
                                <i class="fa-solid ${tool.icon}"></i>
                            </div>
                            <h2 class="tool-title">${tool.name}</h2>
                            <p class="tool-short">${tool.shortDesc}</p>
                            <div class="hint-text">
                                <i class="fa-solid fa-hand-pointer"></i> اضغط لمعرفة التفاصيل
                            </div>
                        </div>

                        <!-- الوجه الخلفي -->
                        <div class="card-face card-back">
                            <div>
                                <h3>حول أداة ${tool.name}</h3>
                                <p class="full-desc">${tool.fullDesc}</p>
                                <ul class="features-list">
                                    ${tool.features.map(f => `<li><i class="fa-solid fa-circle-check"></i> ${f}</li>`).join('')}
                                </ul>
                            </div>
                            <a href="${tool.link}" target="_blank" rel="noopener noreferrer" class="tool-link" onclick="event.stopPropagation()">
                                الموقع الرسمي <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.8rem; margin-right: 4px;"></i>
                            </a>
                        </div>
                    </div>
                `;
                fragment.appendChild(cardPerspective);
            });

            container.appendChild(fragment);
        }

        // تفاعلية قلب البطاقة
        function toggleFlip(cardEl) {
            cardEl.classList.toggle('is-flipped');
        }

        // اختيار التصنيف
        function selectCategory(catId, btnElement) {
            currentCategory = catId;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            document.getElementById('searchInput').value = '';
            
            const filtered = (catId === 'all') 
                ? aiTools 
                : aiTools.filter(t => t.category === catId);

            renderCards(filtered);
            container.scrollTo({ left: 0, behavior: 'smooth' });
        }

        // البحث الفوري
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            
            let filtered = (currentCategory === 'all') 
                ? aiTools 
                : aiTools.filter(t => t.category === currentCategory);

            if (query !== '') {
                filtered = filtered.filter(tool => 
                    tool.name.toLowerCase().includes(query) || 
                    tool.shortDesc.toLowerCase().includes(query) ||
                    tool.fullDesc.toLowerCase().includes(query) ||
                    tool.catLabel.toLowerCase().includes(query)
                );
            }
            renderCards(filtered);
        }

        // تبديل العرض بين السلايدر والشبكة
        function setViewMode(mode) {
            const btnSlider = document.getElementById('btnSlider');
            const btnGrid = document.getElementById('btnGrid');
            const arrowPrev = document.getElementById('arrowPrev');
            const arrowNext = document.getElementById('arrowNext');

            if (mode === 'grid') {
                container.classList.add('grid-mode');
                btnGrid.classList.add('active');
                btnSlider.classList.remove('active');
                arrowPrev.classList.add('hidden');
                arrowNext.classList.add('hidden');
            } else {
                container.classList.remove('grid-mode');
                btnSlider.classList.add('active');
                btnGrid.classList.remove('active');
                arrowPrev.classList.remove('hidden');
                arrowNext.classList.remove('hidden');
            }
        }

        // تمرير السلايدر
        function scrollSlider(direction) {
            const scrollAmount = 350;
            if (direction === 'left') {
                container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
            } else {
                container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            }
        }

        // البدء والتشغيل
        buildCategoriesNav();
        renderCards(aiTools);
    </script>
